name: Apex News Bot

on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-news-bot
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile apex_news_bot.py github_state.py

      - name: Restore delivery history
        id: restore
        run: python github_state.py restore

      - name: Check news and send new articles
        id: news
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHECK_INTERVAL_SECONDS: '600'
          FREE_TRANSLATION: 'true'
          PYTHONUNBUFFERED: '1'
        run: timeout --signal=INT --kill-after=15s 300s python apex_news_bot.py --once

      - name: Save delivery history even after a send failure
        if: ${{ always() && steps.restore.outcome == 'success' && steps.news.outcome != 'skipped' }}
        run: python github_state.py save
